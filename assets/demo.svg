<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
  <defs>
    <clipPath id="window"><rect width="760" height="308" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#window)">
    <rect width="760" height="308" rx="10" fill="#0d1117"/>
    <rect width="760" height="34" fill="#161b22"/>
    <circle cx="22" cy="17" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="17" r="6" fill="#febc2e"/>
    <circle cx="62" cy="17" r="6" fill="#28c840"/>
    <text x="380" y="21" text-anchor="middle" fill="#8b949e" font-size="12">cdx</text>
    <g xml:space="preserve" fill="#e6edf3">
      <text x="20" y="58" opacity="0"><tspan fill="#7ee787">$</tspan> cdx spawn <tspan fill="#d2a8ff">fix-auth</tspan> <tspan fill="#79c0ff">--cd</tspan> ~/app <tspan fill="#79c0ff">--bg</tspan> <tspan fill="#a5d6ff">"Find the race in auth.test.ts and fix it."</tspan><set attributeName="opacity" to="1" begin="0.4s" fill="freeze"/></text>
      <text x="20" y="78" opacity="0" fill="#8b949e">cdx: detached pid=4711; poll with cdx status / cdx wait fix-auth<set attributeName="opacity" to="1" begin="0.9s" fill="freeze"/></text>
      <text x="20" y="98" opacity="0"><tspan fill="#7ee787">$</tspan> cdx spawn <tspan fill="#d2a8ff">api-docs</tspan> <tspan fill="#79c0ff">--cd</tspan> ~/app <tspan fill="#79c0ff">--bg</tspan> <tspan fill="#a5d6ff">"Document every public endpoint."</tspan><set attributeName="opacity" to="1" begin="1.4s" fill="freeze"/></text>
      <text x="20" y="118" opacity="0" fill="#8b949e">cdx: detached pid=4718; poll with cdx status / cdx wait api-docs<set attributeName="opacity" to="1" begin="1.9s" fill="freeze"/></text>
      <text x="20" y="138" opacity="0"><tspan fill="#7ee787">$</tspan> cdx status<set attributeName="opacity" to="1" begin="2.5s" fill="freeze"/></text>
      <text x="20" y="158" opacity="0" fill="#8b949e">LANE      STATE    ROUND  TOKENS  IDLE  ACTIVITY<set attributeName="opacity" to="1" begin="3.0s" fill="freeze"/></text>
      <text x="20" y="178" opacity="0"><tspan fill="#d2a8ff">fix-auth</tspan>  <tspan fill="#d29922">running</tspan>  r1     1.2Min  3s    command_execution: bun test auth<set attributeName="opacity" to="1" begin="3.1s" fill="freeze"/></text>
      <text x="20" y="198" opacity="0"><tspan fill="#d2a8ff">api-docs</tspan>  <tspan fill="#d29922">running</tspan>  r1     840kin  1s    file_change: openapi.yaml<set attributeName="opacity" to="1" begin="3.2s" fill="freeze"/></text>
      <text x="20" y="218" opacity="0"><tspan fill="#7ee787">$</tspan> cdx wait fix-auth api-docs<set attributeName="opacity" to="1" begin="3.9s" fill="freeze"/></text>
      <text x="20" y="238" opacity="0" fill="#8b949e">cdx: lane=<tspan fill="#d2a8ff">fix-auth</tspan> state=<tspan fill="#3fb950">done</tspan> exit=0 report=~/.cdx/reports/fix-auth-r1.md<set attributeName="opacity" to="1" begin="4.7s" fill="freeze"/></text>
      <text x="20" y="258" opacity="0" fill="#8b949e">cdx: lane=<tspan fill="#d2a8ff">api-docs</tspan> state=<tspan fill="#3fb950">done</tspan> exit=0 report=~/.cdx/reports/api-docs-r1.md<set attributeName="opacity" to="1" begin="5.0s" fill="freeze"/></text>
      <text x="20" y="284" opacity="0"><tspan fill="#7ee787">$</tspan><set attributeName="opacity" to="1" begin="5.5s" fill="freeze"/></text>
    </g>
    <rect x="36" y="273" width="8" height="15" fill="#e6edf3" opacity="0">
      <set attributeName="opacity" to="1" begin="5.5s" fill="freeze"/>
      <animate attributeName="fill-opacity" values="1;1;0;0;1" dur="1.1s" begin="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
